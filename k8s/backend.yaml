apiVersion: v1
kind: Secret
metadata:
  name: portal-backend-secret
  namespace: release-portal
type: Opaque
stringData:
  # CHANGE ME: generate a strong random secret before deploying
  JWT_SECRET: "change-me-generate-with-openssl-rand-hex-32"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-backend
  namespace: release-portal
  labels: { app: portal-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: portal-backend }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: portal-backend }
    spec:
      containers:
        - name: backend
          image: release-portal-backend:v1.0.0   # overridden by build-release.sh via kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef: { name: portal-postgres-secret }   # DATABASE_URL
            - secretRef: { name: portal-backend-secret }    # JWT_SECRET
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: portal-backend
  namespace: release-portal
spec:
  selector: { app: portal-backend }
  ports:
    - port: 8080
      targetPort: 8080
