version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: release_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000_create_keycloak_db.sql:/docker-entrypoint-initdb.d/000_create_keycloak_db.sql
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/migrations/002_add_release_columns.sql:/docker-entrypoint-initdb.d/002_add_release_columns.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/release_portal?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend

  # Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # HashiCorp Vault (Secrets Management)
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault

  # ArgoCD test stub for local development (no K8s cluster required).
  # Emulates the ArgoCD REST API endpoints used by the backend:
  #   POST /api/v1/session            -> basic auth admin/admin, returns token
  #   GET  /api/v1/applications       -> list apps (seeded with demo apps)
  #   POST /api/v1/applications/<name>/sync -> sync action
  #   PUT  /api/v1/applications/<name>PUT  /api/v1/applications/<name>        -> JSON-patch (targetRevision, canary annotations)
  # UI/API in Settings integration URL: http://argocd:8080 (from docker network)
  # or http://localhost:8085 from the host. Login: admin / admin
  argocd:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "8085:8080"   # ArgoCD-compatible HTTP API
    volumes:
      - ./scripts/argocd-mock:/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/applications"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GitLab CE (Source Code Management)
  gitlab:
    image: gitlab/gitlab-ce:16.8.0-ce.0
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local'
        gitlab_rails['time_zone'] = 'UTC'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        # Disable HTTPS for local development
        nginx['redirect_http_to_https'] = false
        # Reduce memory usage
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        # Enable API
        gitlab_rails['gitlab_ci_enabled'] = true
    ports:
      - "8083:80"      # HTTP
      - "8084:443"     # HTTPS
      - "2222:22"      # SSH
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # GitLab needs time to start

volumes:
  postgres_data:
  vault_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
